name: Build Lean 4.33.0 + Mathlib 4.33.0 Offline Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.0
  LEAN_VERSION: "4.33.0"
  LEAN_COMMIT: d8b18978322de05a8f3dba51ef03cf5461676c17
  MATHLIB_TAG: v4.33.0
  MATHLIB_COMMIT: db584cd6d46c92f209a44c0f1c829460d327499d
  BUNDLE_NAME: SSC_Lean4_4.33.0_Mathlib_4.33.0_linux_x86_64_offline_v1

jobs:
  build-offline-runtime:
    name: Build and verify offline runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Show runner capacity
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          df -h /
          free -h

      - name: Install packaging prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd \
            jq

      - name: Install Elan
        shell: bash
        run: |
          set -euxo pipefail

          # Pin Elan itself for reproducibility of the bootstrap step.
          ELAN_VERSION="v4.2.2"

          curl -sSfL \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz

          ./elan-init -y --default-toolchain none

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"

          elan --version

      - name: Install and verify exact Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"

          elan toolchain install "$LEAN_TOOLCHAIN"
          elan default "$LEAN_TOOLCHAIN"

          lean --version
          lake --version

          LEAN_VERSION_OUTPUT="$(lean --version)"

          echo "$LEAN_VERSION_OUTPUT" | grep -F "Lean (version ${LEAN_VERSION}"
          echo "$LEAN_VERSION_OUTPUT" | grep -F "$LEAN_COMMIT"

          TOOLCHAIN_ROOT="$(dirname "$(dirname "$(elan which lean)")")"
          test -x "$TOOLCHAIN_ROOT/bin/lean"
          test -x "$TOOLCHAIN_ROOT/bin/lake"

          echo "TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      - name: Create pinned Mathlib seed project
        shell: bash
        run: |
          set -euxo pipefail

          SEED="$RUNNER_TEMP/ssc-lean433-seed"
          mkdir -p "$SEED"

          cat > "$SEED/lean-toolchain" <<EOF
          ${LEAN_TOOLCHAIN}
          EOF

          cat > "$SEED/lakefile.toml" <<EOF
          name = "SSCLean433OfflineRuntime"
          version = "1.0.0"
          defaultTargets = ["OfflineProbe"]

          [[require]]
          name = "mathlib"
          scope = "leanprover-community"
          rev = "${MATHLIB_TAG}"

          [[lean_lib]]
          name = "OfflineProbe"
          EOF

          cat > "$SEED/OfflineProbe.lean" <<'EOF'
          import Mathlib

          example (n : Nat) : n + 0 = n := by
            simp

          example : (2 : ℤ) + 3 = 5 := by
            norm_num

          example : Nat.gcd 18 24 = 6 := by
            norm_num
          EOF

          echo "SEED=$SEED" >> "$GITHUB_ENV"

      - name: Resolve Mathlib, fetch compiled cache, and build
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"

          cd "$SEED"

          lake update
          lake exe cache get
          lake build

          test -f lake-manifest.json
          test -d .lake/packages/mathlib
          test -d .lake/packages/mathlib/.lake/build

          ACTUAL_MATHLIB_COMMIT="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          echo "Resolved Mathlib commit: $ACTUAL_MATHLIB_COMMIT"
          test "$ACTUAL_MATHLIB_COMMIT" = "$MATHLIB_COMMIT"

          MANIFEST_MATHLIB_COMMIT="$(
            jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json
          )"
          MANIFEST_MATHLIB_INPUT="$(
            jq -r '.packages[] | select(.name == "mathlib") | .inputRev' lake-manifest.json
          )"

          test "$MANIFEST_MATHLIB_COMMIT" = "$MATHLIB_COMMIT"
          test "$MANIFEST_MATHLIB_INPUT" = "$MATHLIB_TAG"

          echo "Dependency tree size:"
          du -sh .lake/packages

      - name: Assemble portable runtime without duplicating Mathlib
        shell: bash
        run: |
          set -euxo pipefail

          STAGE="$RUNNER_TEMP/ssc-runtime-stage"
          BUNDLE="$STAGE/$BUNDLE_NAME"

          mkdir -p "$BUNDLE/scripts"

          # Move the already-populated Mathlib environment rather than copying it.
          # This is important on GitHub hosted runners because the tree is multi-GB.
          mv "$SEED" "$BUNDLE/mathlib-env"

          # Move the installed Lean distribution out of Elan.  The Lean/Lake binaries
          # in this directory are used directly by the offline runtime; Elan itself is
          # not required after extraction.
          mv "$TOOLCHAIN_ROOT" "$BUNDLE/toolchain"

          cat > "$BUNDLE/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SSC_LEAN_RUNTIME_ROOT="$(
            cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1
            pwd
          )"

          export SSC_LEAN_RUNTIME_ROOT
          export PATH="$SSC_LEAN_RUNTIME_ROOT/toolchain/bin:$PATH"

          echo "SSC Lean runtime: $SSC_LEAN_RUNTIME_ROOT"
          "$SSC_LEAN_RUNTIME_ROOT/toolchain/bin/lean" --version
          "$SSC_LEAN_RUNTIME_ROOT/toolchain/bin/lake" --version
          EOF
          chmod +x "$BUNDLE/activate.sh"

          cat > "$BUNDLE/scripts/build-project-offline.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ $# -ne 1 ]]; then
            echo "usage: $0 /path/to/lean-project" >&2
            exit 2
          fi

          SCRIPT_DIR="$(
            cd "$(dirname "${BASH_SOURCE[0]}")" >/dev/null 2>&1
            pwd
          )"
          RUNTIME_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"
          PROJECT="$(cd "$1" && pwd)"

          EXPECTED_TOOLCHAIN="leanprover/lean4:v4.33.0"
          EXPECTED_MATHLIB_COMMIT="db584cd6d46c92f209a44c0f1c829460d327499d"

          if [[ ! -f "$PROJECT/lean-toolchain" ]]; then
            echo "ERROR: project has no lean-toolchain file" >&2
            exit 3
          fi

          ACTUAL_TOOLCHAIN="$(tr -d '\r\n' < "$PROJECT/lean-toolchain")"
          if [[ "$ACTUAL_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]]; then
            echo "ERROR: project toolchain is '$ACTUAL_TOOLCHAIN'; expected '$EXPECTED_TOOLCHAIN'" >&2
            exit 4
          fi

          if [[ ! -f "$PROJECT/lake-manifest.json" ]]; then
            echo "ERROR: project has no lake-manifest.json." >&2
            echo "For governed offline builds, resolve and freeze the manifest before use." >&2
            exit 5
          fi

          RUNTIME_MANIFEST="$RUNTIME_ROOT/mathlib-env/lake-manifest.json"
          if [[ ! -f "$RUNTIME_MANIFEST" ]]; then
            echo "ERROR: offline runtime manifest is missing" >&2
            exit 6
          fi

          # Verify the target project requests exactly the same Git dependency graph
          # as the runtime bundle.  This prevents the offline override mechanism from
          # silently building against different dependency revisions.
          python3 - \
            "$PROJECT/lake-manifest.json" \
            "$RUNTIME_MANIFEST" \
            "$RUNTIME_ROOT/mathlib-env/.lake/packages" \
            "$EXPECTED_MATHLIB_COMMIT" <<'PY'
          import json
          import pathlib
          import sys

          project_manifest_path = pathlib.Path(sys.argv[1])
          runtime_manifest_path = pathlib.Path(sys.argv[2])
          packages_root = pathlib.Path(sys.argv[3])
          expected_mathlib = sys.argv[4]

          def load(path):
              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)

          def git_graph(manifest):
              graph = {}
              for pkg in manifest.get("packages", []):
                  if pkg.get("type") != "git":
                      continue
                  key = (pkg.get("scope", ""), pkg["name"])
                  graph[key] = pkg.get("rev", "")
              return graph

          project = load(project_manifest_path)
          runtime = load(runtime_manifest_path)

          project_graph = git_graph(project)
          runtime_graph = git_graph(runtime)

          if project_graph != runtime_graph:
              missing = sorted(set(runtime_graph) - set(project_graph))
              extra = sorted(set(project_graph) - set(runtime_graph))
              changed = sorted(
                  key for key in set(project_graph) & set(runtime_graph)
                  if project_graph[key] != runtime_graph[key]
              )
              print("ERROR: target project's Git dependency graph does not match runtime.", file=sys.stderr)
              if missing:
                  print(f"  missing from project: {missing}", file=sys.stderr)
              if extra:
                  print(f"  extra in project: {extra}", file=sys.stderr)
              for key in changed:
                  print(
                      f"  revision mismatch {key}: "
                      f"project={project_graph[key]} runtime={runtime_graph[key]}",
                      file=sys.stderr,
                  )
              raise SystemExit(7)

          mathlib_keys = [
              key for key, rev in project_graph.items()
              if key[1] == "mathlib" and rev == expected_mathlib
          ]
          if len(mathlib_keys) != 1:
              print(
                  "ERROR: project does not resolve Mathlib to the governed commit "
                  + expected_mathlib,
                  file=sys.stderr,
              )
              raise SystemExit(8)

          # Every runtime Git package must actually be present locally.
          for (_scope, name), _rev in runtime_graph.items():
              package_dir = packages_root / name
              if not package_dir.is_dir():
                  print(f"ERROR: bundled package directory missing: {package_dir}", file=sys.stderr)
                  raise SystemExit(9)

          print(f"Verified exact offline Git dependency graph: {len(runtime_graph)} packages")
          PY

          export PATH="$RUNTIME_ROOT/toolchain/bin:$PATH"

          # Work in a disposable copy so the authoritative project tree is never
          # modified. Exclude .lake: it may be multi-GB and is replaced by the
          # runtime package overrides below.
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          mkdir -p "$WORK/project"
          tar \
            -C "$PROJECT" \
            --exclude='./.lake' \
            -cf - . \
            | tar -C "$WORK/project" -xf -

          mkdir -p "$WORK/project/.lake"

          # Lake 4.33 package overrides supersede manifest package locations, and
          # the override applies transitively. Redirect every Git dependency in the
          # governed runtime manifest to its bundled local package directory.
          python3 - \
            "$RUNTIME_MANIFEST" \
            "$RUNTIME_ROOT/mathlib-env/.lake/packages" \
            "$WORK/project/.lake/package-overrides.json" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          packages_root = pathlib.Path(sys.argv[2]).resolve()
          output_path = pathlib.Path(sys.argv[3])

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          overrides = []
          for pkg in manifest.get("packages", []):
              if pkg.get("type") != "git":
                  continue

              package_dir = (packages_root / pkg["name"]).resolve()
              if not package_dir.is_dir():
                  raise SystemExit(f"missing bundled package directory: {package_dir}")

              entry = {
                  "type": "path",
                  "dir": str(package_dir),
                  "scope": pkg.get("scope", ""),
                  "name": pkg["name"],
                  "manifestFile": pkg.get("manifestFile", "lake-manifest.json"),
                  "inherited": False,
                  "configFile": pkg.get("configFile", "lakefile.lean"),
              }
              overrides.append(entry)

          payload = {
              "schemaVersion": "1.1.0",
              "packages": overrides,
          }

          output_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Wrote {len(overrides)} transitive package overrides to {output_path}")
          PY

          echo "Using:"
          lean --version
          lake --version

          cd "$WORK/project"

          # --offline forbids remote package materialization.  --packages makes the
          # complete local override set explicit even though Lake also recognizes
          # .lake/package-overrides.json automatically.
          lake \
            --offline \
            --packages=.lake/package-overrides.json \
            build
          EOF
          chmod +x "$BUNDLE/scripts/build-project-offline.sh"

          cat > "$BUNDLE/README_OFFLINE_RUNTIME.md" <<EOF
          # SSC Lean 4.33.0 / Mathlib 4.33.0 Offline Runtime

          This bundle is a project-neutral Linux x86-64 compiler environment.

          Exact governed pins:

          - Lean toolchain: \`${LEAN_TOOLCHAIN}\`
          - Lean commit: \`${LEAN_COMMIT}\`
          - Mathlib input revision: \`${MATHLIB_TAG}\`
          - Mathlib resolved commit: \`${MATHLIB_COMMIT}\`

          Contents:

          - \`toolchain/\` — Lean 4.33.0 distribution, including \`lean\` and \`lake\`
          - \`mathlib-env/\` — populated Lake project with Mathlib and transitive packages
          - \`mathlib-env/.lake/packages/\` — dependency source trees and compiled caches
          - \`activate.sh\` — puts the bundled Lean/Lake binaries on PATH
          - \`scripts/build-project-offline.sh\` — builds a project only after checking
            its Lean and Mathlib pins

          The build helper deliberately requires the target project to contain its own
          frozen \`lake-manifest.json\`.  It does not rewrite authoritative project
          source or governance files.
          EOF

          {
            echo "bundle_name=$BUNDLE_NAME"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "github_repository=$GITHUB_REPOSITORY"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "lean_toolchain=$LEAN_TOOLCHAIN"
            echo "lean_commit=$LEAN_COMMIT"
            echo "mathlib_tag=$MATHLIB_TAG"
            echo "mathlib_commit=$MATHLIB_COMMIT"
            echo
            echo "[lean --version]"
            "$BUNDLE/toolchain/bin/lean" --version
            echo
            echo "[lake --version]"
            "$BUNDLE/toolchain/bin/lake" --version
            echo
            echo "[resolved lake-manifest.json]"
            cat "$BUNDLE/mathlib-env/lake-manifest.json"
          } > "$BUNDLE/RUNTIME_METADATA.txt"

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

          df -h /
          du -sh "$BUNDLE"

      - name: Build an offline-test container image
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$RUNNER_TEMP/Dockerfile.ssc-lean-offline-test" <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update \
              && apt-get install -y --no-install-recommends \
                 ca-certificates \
                 clang \
                 git \
                 libgmp10 \
                 python3 \
              && rm -rf /var/lib/apt/lists/*
          EOF

          docker build \
            -f "$RUNNER_TEMP/Dockerfile.ssc-lean-offline-test" \
            -t ssc-lean-offline-test:24.04 \
            "$RUNNER_TEMP"

      - name: Verify the assembled runtime with networking disabled
        shell: bash
        run: |
          set -euxo pipefail

          # Remove only the seed project's own build output so the probe must compile
          # again. Keep all dependency caches intact.
          rm -rf "$BUNDLE/mathlib-env/.lake/build"

          cat > "$RUNNER_TEMP/offline-lean-probe.sh" <<'EOF'
          set -euxo pipefail
          export PATH="/runtime/toolchain/bin:$PATH"

          lean --version
          lake --version

          test "$(tr -d '\r\n' < /runtime/mathlib-env/lean-toolchain)" = \
            "leanprover/lean4:v4.33.0"

          # Prove the exact bundled Mathlib objects are usable with zero network
          # access, independent of Lake's Git dependency resolver.
          LEAN_PATH="$(
            find /runtime/mathlib-env/.lake/packages \
              -path '*/.lake/build/lib/lean' \
              -type d \
              -print \
              | paste -sd:
          )"

          export LEAN_PATH
          cd /runtime/mathlib-env

          lean OfflineProbe.lean \
            -o /tmp/OfflineProbe.olean \
            -i /tmp/OfflineProbe.ilean

          test -f /tmp/OfflineProbe.olean
          EOF

          chmod +x "$RUNNER_TEMP/offline-lean-probe.sh"

          docker run --rm \
            --network none \
            -v "$BUNDLE:/runtime" \
            -v "$RUNNER_TEMP/offline-lean-probe.sh:/offline-lean-probe.sh:ro" \
            ssc-lean-offline-test:24.04 \
            bash /offline-lean-probe.sh

          # Then test the portable project helper itself with networking disabled.
          cat > "$RUNNER_TEMP/offline-helper-probe.sh" <<'EOF'
          set -euxo pipefail
          /runtime/scripts/build-project-offline.sh /runtime/mathlib-env
          EOF

          chmod +x "$RUNNER_TEMP/offline-helper-probe.sh"

          docker run --rm \
            --network none \
            -v "$BUNDLE:/runtime" \
            -v "$RUNNER_TEMP/offline-helper-probe.sh:/offline-helper-probe.sh:ro" \
            ssc-lean-offline-test:24.04 \
            bash /offline-helper-probe.sh

      - name: Package bundle and generate SHA-256
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/${BUNDLE_NAME}.tar.zst"
          CHECKSUM="$ARCHIVE.sha256"

          # Moderate zstd level with all cores: good compression without excessive
          # hosted-runner time.  upload-artifact is told not to recompress it later.
          tar \
            -I 'zstd -T0 -8' \
            -cf "$ARCHIVE" \
            -C "$STAGE" \
            "$BUNDLE_NAME"

          sha256sum "$ARCHIVE" | tee "$CHECKSUM"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

          ls -lh "$ARCHIVE" "$CHECKSUM"
          df -h /

      - name: Upload offline runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSC-Lean433-Mathlib433-offline-runtime-v1
          path: |
            ${{ github.workspace }}/${{ env.BUNDLE_NAME }}.tar.zst
            ${{ github.workspace }}/${{ env.BUNDLE_NAME }}.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
