name: Lean formal verification

on:
  push:
    paths:
      - 'formal/**'
      - 'tools/check_lean_alignment.py'
      - 'tests/test_lean_alignment.py'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'tools/check_lean_alignment.py'
      - 'tests/test_lean_alignment.py'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify capstone source identity and proof hygiene
        run: python tools/check_lean_alignment.py

  build:
    needs: source-identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - CNRSCore
          - CnrsQ2
          - CNRSArithmetic
          - CNRSIntegration
          - CNRSProblem1
          - CNRSProblem2
    defaults:
      run:
        working-directory: formal/lean/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify pinned Lean toolchain
        run: lean --version
      - name: Fetch pinned Mathlib build cache
        run: lake exe cache get
      - name: Build ${{ matrix.project }}
        run: lake build
