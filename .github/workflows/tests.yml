name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: v0.14.0 streaming-division acceptance contract
        run: pytest -q acceptance/v014
      - name: v0.15.0 finite-convolution acceptance contract
        run: |
          pytest -q tests/test_v015_finite_convolution.py
          python tools/check_v015_claims.py
      - name: v0.16.0 exact-multiplication acceptance contract
        run: |
          pytest -q tests/test_v016_exact_multiplication.py
          pytest -q acceptance/v016
          python tools/check_v016_claims.py
          python tools/check_lean_alignment.py
      - name: v0.17.0 exact-division acceptance contract
        run: |
          pytest -q tests/test_v017_exact_division.py
          pytest -q acceptance/v017
          python tools/check_v017_claims.py
          python tools/check_lean_alignment.py

  distribution:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python tools/build_reproducible_distributions.py
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/cnrs-wheel-venv
          /tmp/cnrs-wheel-venv/bin/python -m pip install dist/cnrs-0.16.0-py3-none-any.whl
          /tmp/cnrs-wheel-venv/bin/python -c "import cnrs; from cnrs import cnrs_string_to_finite_sequence, finite_sequence_to_cnrs_string, mul_cnrs; assert cnrs.__version__ == '0.16.0'; assert finite_sequence_to_cnrs_string(cnrs_string_to_finite_sequence('.1')) == '0.1'; assert finite_sequence_to_cnrs_string(cnrs_string_to_finite_sequence('1.')) == '1'; assert mul_cnrs('.1', '1.') == '0.1'"
          /tmp/cnrs-wheel-venv/bin/python -c "from fractions import Fraction; from cnrs import DivisionStreamStatus, divide_cnrs_exact, validate_division_witness; t=divide_cnrs_exact('1','10'); p=divide_cnrs_exact('1','2'); l=divide_cnrs_exact('1','2',max_steps=1); assert t.status is DivisionStreamStatus.TERMINATING; assert t.exact_value_fractions()==(Fraction(-2,5),Fraction(-1,5)); assert p.status is DivisionStreamStatus.EVENTUALLY_PERIODIC; assert p.exact_value_fractions()==(Fraction(1,2),Fraction(0)); assert validate_division_witness(t.to_witness())==t.to_witness(); assert validate_division_witness(p.to_witness())==p.to_witness(); assert l.status is DivisionStreamStatus.LIMIT_REACHED and l.witness is None"
      - name: Verify source distribution in a clean environment
        run: |
          python -m venv /tmp/cnrs-sdist-venv
          /tmp/cnrs-sdist-venv/bin/python -m pip install dist/cnrs-0.16.0.tar.gz
          /tmp/cnrs-sdist-venv/bin/python -c "import cnrs; from cnrs import cnrs_string_to_finite_sequence, finite_sequence_to_cnrs_string, mul_cnrs; assert cnrs.__version__ == '0.16.0'; assert finite_sequence_to_cnrs_string(cnrs_string_to_finite_sequence('.1')) == '0.1'; assert finite_sequence_to_cnrs_string(cnrs_string_to_finite_sequence('1.')) == '1'; assert mul_cnrs('.1', '1.') == '0.1'"
          /tmp/cnrs-sdist-venv/bin/python -c "from fractions import Fraction; from cnrs import DivisionStreamStatus, divide_cnrs_exact, validate_division_witness; t=divide_cnrs_exact('1','10'); p=divide_cnrs_exact('1','2'); l=divide_cnrs_exact('1','2',max_steps=1); assert t.status is DivisionStreamStatus.TERMINATING; assert t.exact_value_fractions()==(Fraction(-2,5),Fraction(-1,5)); assert p.status is DivisionStreamStatus.EVENTUALLY_PERIODIC; assert p.exact_value_fractions()==(Fraction(1,2),Fraction(0)); assert validate_division_witness(t.to_witness())==t.to_witness(); assert validate_division_witness(p.to_witness())==p.to_witness(); assert l.status is DivisionStreamStatus.LIMIT_REACHED and l.witness is None"
      - name: Record immutable build identity and checksums
        run: |
          git rev-parse HEAD > dist/CANDIDATE_COMMIT.txt
          git rev-parse HEAD^{tree} > dist/CANDIDATE_TREE.txt
          python tools/check_release_assets.py --version 0.16.0 --tag v0.16.0 --directory dist
      - name: Upload auditable v0.16.0 distributions
        uses: actions/upload-artifact@v7
        with:
          name: cnrs-v0.16.0-distributions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/cnrs-0.16.0-py3-none-any.whl
            dist/cnrs-0.16.0.tar.gz
            dist/SHA256SUMS.txt
            dist/CANDIDATE_COMMIT.txt
            dist/CANDIDATE_TREE.txt
          if-no-files-found: error
          retention-days: 90
